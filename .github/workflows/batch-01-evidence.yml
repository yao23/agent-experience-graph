name: Validate Batch 01 Evidence

on:
  pull_request:
    paths:
      - "dogfood/self-consumption-batch-01/**"
      - ".github/workflows/batch-01-evidence.yml"
  push:
    branches: [main]
    paths:
      - "dogfood/self-consumption-batch-01/**"
      - ".github/workflows/batch-01-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sanitized Batch 01 evidence
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 dogfood/self-consumption-batch-01/validate_evidence.py \
            --base-ref "$BASE_REF"
