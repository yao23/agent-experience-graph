name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "site.css"
      - "site.js"
      - "favicon.svg"
      - ".nojekyll"
      - "docs/**"
      - "pitch/**"
      - "experiences/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source from main
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out current published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/.git

          # Homepage assets are canonical on main.
          rm -f public/styles.css public/script.js
          for file in index.html site.css site.js favicon.svg .nojekyll; do
            if [[ -f "source/$file" ]]; then
              cp "source/$file" "public/$file"
            fi
          done

          # These directories are canonical on main and are fully synchronized.
          rm -rf public/docs public/pitch public/experiences
          mkdir -p public/docs public/pitch public/experiences
          cp -R source/docs/. public/docs/
          cp -R source/pitch/. public/pitch/
          cp source/experiences/index.html source/experiences/index.json public/experiences/
          cp -R source/experiences/data public/experiences/data
          for directory in source/experiences/*/; do
            if [[ -f "$directory/index.html" ]]; then
              slug="$(basename "$directory")"
              mkdir -p "public/experiences/$slug"
              cp -R "$directory/." "public/experiences/$slug/"
            fi
          done

          touch public/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          force_orphan: false
          enable_jekyll: false
          commit_message: "Deploy site from main at ${{ github.sha }}"
