name: Validate Repair Lab

on:
  pull_request:
    paths:
      - "experiences/**"
      - "experiments/public-repair-lab/**"
      - "integrations/vscode/**"
      - "scripts/**"
      - "references/trace_schema.md"
      - "README.md"
      - "SKILL.md"
      - "capability.json"
      - ".github/workflows/repair-lab.yml"
  push:
    branches: [main]
    paths:
      - "experiences/**"
      - "experiments/public-repair-lab/**"
      - "integrations/vscode/**"
      - "scripts/**"
      - "references/trace_schema.md"
      - "README.md"
      - "SKILL.md"
      - "capability.json"
      - ".github/workflows/repair-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json

      - name: Validate public experience schemas
        run: |
          npx --yes ajv-cli@5.0.0 validate --all-errors \
            -s experiences/verified-experience.schema.json \
            -d experiences/verified.json
          npx --yes ajv-cli@5.0.0 validate --all-errors \
            -s experiments/public-repair-lab/paired-results.schema.json \
            -d experiments/public-repair-lab/results/v0.1.3-paired-results.json
          npx --yes ajv-cli@5.0.0 validate --all-errors \
            -s experiments/public-repair-lab/paired-results.schema.json \
            -d experiments/public-repair-lab/results/tr-04-protocol-transfer-pair.json
          npx --yes ajv-cli@5.0.0 validate --all-errors \
            -s experiments/public-repair-lab/paired-results.schema.json \
            -d experiments/public-repair-lab/results/tr-04-failed-path-prevention-pair.json
          python3 scripts/validate_verified_experiences.py
          python3 experiments/public-repair-lab/validate_paired_results.py
          python3 experiments/public-repair-lab/validate_paired_results.py \
            --results experiments/public-repair-lab/results/tr-04-protocol-transfer-pair.json \
            --skip-experience
          python3 experiments/public-repair-lab/validate_paired_results.py \
            --results experiments/public-repair-lab/results/tr-04-failed-path-prevention-pair.json \
            --skip-experience
          python3 -m json.tool \
            experiments/public-repair-lab/experiments/tr-04-failed-path-prevention-manifest.json \
            >/dev/null

      - name: Test retrieval, validation, telemetry, and task preparation
        run: |
          python3 scripts/test_recommend_traces.py
          python3 scripts/test_validate_verified_experiences.py
          python3 experiments/public-repair-lab/test_run_experiment.py
          python3 experiments/public-repair-lab/test_validate_paired_results.py
          python3 experiments/public-repair-lab/run_experiment.py --prepare-only --task fastapi-nested-response --trials 3 --output /tmp/aeg-fastapi
          python3 experiments/public-repair-lab/run_experiment.py --prepare-only --task pysnooper-path-output --output /tmp/aeg-pysnooper
          python3 experiments/public-repair-lab/run_experiment.py --prepare-only --task protocol-resource-delegation --output /tmp/aeg-protocol-transfer
          python3 experiments/public-repair-lab/run_experiment.py --prepare-only --task rpc-upgrade-interactive-mode --output /tmp/aeg-rpc-trap

      - name: Install extension dependencies
        working-directory: integrations/vscode
        run: npm ci

      - name: Test and package extension
        working-directory: integrations/vscode
        run: |
          npm test
          npm run compile
          npm run package
