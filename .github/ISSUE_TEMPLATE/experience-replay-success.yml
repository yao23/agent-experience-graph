name: Report a successful experience replay
description: Add objective evidence that a Registry experience reproduced successfully.
title: "[Replay success]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing a recovery path. Do not include credentials, proprietary code, personal data, customer data, private paths, raw prompts, or other secrets. Submitted code is not executed automatically.
  - type: input
    id: experience_id
    attributes:
      label: Experience ID
      placeholder: trace-2026-08-03-tr-04-tornado-nodelay
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version context
      description: Include OS, runtime, framework, dependency, CI, and source revision details.
    validations:
      required: true
  - type: textarea
    id: agent_context
    attributes:
      label: Agent, model, harness, and reasoning context
      description: Provide each value when known; use `unknown` instead of guessing.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Replay outcome
      options:
        - Reproduced successfully without material deviation
        - Reproduced successfully with documented adaptation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Objective verification evidence
      description: List the failure reproduction, recovery checks, regression checks, and public-safe evidence links.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Token, command, retry, and wall-time metrics
      description: Report measured values and units; mark unavailable values `unknown` with a reason.
    validations:
      required: true
  - type: dropdown
    id: permission
    attributes:
      label: Permission to retain and publish sanitized information
      options:
        - Yes — AEG may retain, review, sanitize, and publish this replay evidence
        - No — do not retain or publish this replay evidence
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, proprietary code, personal data, customer data, private paths, and other secrets.
          required: true
        - label: I understand that submitted code will not be executed automatically.
          required: true
