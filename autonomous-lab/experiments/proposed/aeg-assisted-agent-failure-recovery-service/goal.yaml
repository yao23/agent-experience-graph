schema_version: 1
experiment_id: aeg-assisted-agent-failure-recovery-service-v0
experiment_version: 2
title: AEG-assisted Agent Failure Recovery Service
hypothesis: A bounded repository-local Phase 0 can produce an internally reviewable service package with enforceable evidence, privacy, pricing, and evaluation boundaries without contacting users, publishing, running repairs, or claiming AEG effectiveness.
customer_segment: Independent developers and small engineering teams using Playwright, CI systems, or coding agents who experience repeated failures, ineffective retries, or difficult-to-diagnose regressions
customer_problem: Repeated agent and CI failures consume diagnosis time, while unsupported reuse claims and unclear evidence boundaries make recovery services difficult to trust.
deliverable_type: unpublished Phase 0 service package, templates, sample report, protocols, and deterministic scorecard
acceptance_tests:
  - id: phase0-artifact-package
    objective: Every required Phase 0 artifact exists, links resolve, and the custom scorecard is complete only after deterministic validation.
    command: python3 autonomous-lab/scripts/lab.py validate
    oracle: The lab validator exits zero and phase0-validation.json records every required check as passed.
  - id: phase0-boundary-oracle
    objective: The package contains no unsupported effectiveness or PMF claim, private material, external action, published offer, or authorization beyond Phase 0.
    command: python3 autonomous-lab/scripts/lab.py validate
    oracle: Boundary, privacy, sensitive-content, approval-scope, and verified-library checks all pass.
objective_oracle:
  kind: schema
  description: Deterministic repository-local validation of required artifacts, links, approval scope, evidence claims, privacy boundaries, budgets, and next-decision wording.
  pass_condition: All Phase 0 acceptance checks pass without network, external writes, repair execution, publication, or verified-library mutation.
baseline: Future Phase 1 design only; a blind recovery attempt with AEG retrieval disabled after freshness, privacy, contribution, and oracle gates pass. No baseline runs in Phase 0.
treatment: Future Phase 1 design only; a separate blind recovery attempt with AEG queried before diagnosis and only verified relevant experiences eligible. No treatment runs in Phase 0.
minimum_comparison_pairs: 1
metrics:
  quality: [task success rate, first-pass success, regression-free rate, improvement from delivery N compared with delivery 1]
  time: [time to verified repair]
  model_calls: [model calls per delivery]
  retries: [retries per failure family]
  tokens: [input tokens where available, output tokens where available]
  cost: [model cost in USD, founder cost per accepted delivery]
  human_intervention: [human interventions, human minutes]
  retrieval: [valid pre-diagnosis retrieval rate, relevant recommendation rate, treatment execution changes attributable to retrieval]
  external_user: [external acceptance, user activation, repeated usage, customer-reported time saved]
  revenue: [willingness to pay, first revenue, paid-diagnostic conversion]
output:
  kind: service
  artifact: sanitized per-pair run records, append-only evidence, and a deterministic scorecard
  delivery_path: repository-local draft review until external delivery is separately approved
external_metrics: [upstream acceptance, maintainer usefulness rating, repeated use by the same customer]
commercial_gates:
  - 3 to 5 real external users after explicit recruitment approval
  - at least one independently accepted repair or deliverable
  - at least one repeat user or one paid diagnostic
  - a preregistered baseline and treatment comparison
  - no promotion based only on synthetic or historical replay
budgets:
  max_iterations: 8
  max_commands: 64
  max_tests: 128
  max_model_calls: 8
  max_wall_clock_hours: 8
  max_tokens: 0
  max_model_cost_usd: 0
  max_same_failure_repeats: 3
stop_conditions:
  - any action exceeds repository-local Phase 0 preparation
  - any external contact, write, publication, payment, repair execution, promotion, release, secret use, or personal-information collection would be required
  - any artifact, link, evidence claim, privacy boundary, approval hash, or verified-library check fails
  - any command, test, time, token, cost, or retry budget is exhausted
  - eight scheduled or model-assisted Phase 0 runs are consumed
  - Phase 1 recruitment or external validation would begin without a new approval
approval_gates:
  begin_experiment: required
  model_or_agent_execution: required
  paid_execution: required
  external_project_write: required
  contact_external_user: required
  open_or_merge_pull_request: required
  candidate_promotion: required
  verified_library_change: required
  release_publication: required
  secret_creation_or_use: required
allowed_actions:
  - repository-local planning and creation of the approved Phase 0 artifacts
  - read existing public AEG repository evidence within its documented limitations
  - generate and validate service specifications, templates, unpublished copy and drafts, pricing hypotheses, protocols, reports, and scorecards
  - perform one repository-local Phase 0 transition per scheduled run, up to eight runs
forbidden_actions:
  - contact users or developers, collect personal information, or write to external projects
  - publish or release any website, post, package, extension, offer, outreach message, price, or artifact
  - charge money, accept payment, use credentials or secrets, or incur a paid experiment cost
  - start a real repair, baseline arm, treatment arm, Phase 1 recruitment, or Batch 03
  - promote an experience or modify experiences/verified.json
  - claim AEG repair improvement, generalized effectiveness, external acceptance, commercial demand, or PMF from Phase 0
